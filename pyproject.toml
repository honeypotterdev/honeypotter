[project]
name = "honeypotter"
version = "0.1.5"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vlad Dmitrievich", email = "2tunnels@proton.me" }
]
requires-python = ">=3.14.3"
dependencies = [
    "click>=8.5.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[project.scripts]
honeypotter = "honeypotter.cli:cli"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
