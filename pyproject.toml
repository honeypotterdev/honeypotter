[project]
name = "honeypotter"
version = "0.1.50"
description = "An experimental Python honeypot for Telnet, Redis, MQTT, and raw TCP"
readme = "README.md"
authors = [
    { name = "Vlad Dmitrievich", email = "2tunnels@proton.me" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["honeypot", "security", "networking", "telnet", "redis", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Terminals :: Telnet",
]
requires-python = ">=3.14.3"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-core>=2.50.4",
    "sentry-sdk>=2.71.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "vulture>=2.16",
]

[project.scripts]
honeypotter = "honeypotter.cli:cli"

[project.urls]
Homepage = "https://honeypotter.dev"
Repository = "https://github.com/honeypotterdev/honeypotter"
Issues = "https://github.com/honeypotterdev/honeypotter/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
